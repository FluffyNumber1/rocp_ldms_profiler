[tool]
window_ms=1000
max_records_per_message=256

[ldms]
host=127.0.0.1
port=10411
xprt=sock
auth=none

[pc]
enabled=true
interval_cycles=1048576

[device]
enabled=false
interval_ms=50
# Long-format rows allow this list to change without changing the LDMS schema.
# SQ_WAVES is the counter used by AMD's ROCProfiler SDK device-counting sample.
counters=SQ_WAVES

[trace]
enabled=false
hip_runtime=true
kernel_dispatch=true
memory_copy=true
memory_allocation=true
scratch_memory=true
runtime_initialization=true
correlation_retirement=true
